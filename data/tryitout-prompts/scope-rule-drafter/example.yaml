# Try It Out example for scope-rule-drafter: the only place the default task, file and saved result are named.
# Loaded by src/lib/server/tryItOutExample.ts. The result is shown without a model call.
# The task box holds scope notes as a person would type them, one per line (only some become rules); the file is the E-BOM data they
# apply to (blocks, catalogue, elements; no rules yet).
task: |-
  Sprinkler piping is delivered by the sprinkler contractor.
  Temporary ducts for site ventilation are not part of this contract.
  Insulation of cold-water pipes is billed by the insulation contractor.
  Exhaust valves in the basement storage rooms are supplied by the owner.
  All round ducts must be spiral-seamed.
  Kitchen hood ducts are delivered by the kitchen supplier.
task_label: Scope notes in your own words, one per line
task_placeholder: "One note per line, for example: Sprinkler piping is delivered by the sprinkler contractor."
file: sample-ebom-input.txt
file_label: E-BOM input file the rules apply to (blocks, catalogue and elements)
hint: >-
  Notes that exclude elements ("delivered by", "not part of this contract", "excluded" ...) become rules, matched
  against the elements of the attached E-BOM file; requirements ("must be ...") stay notes. Edit or replace the
  example notes, keep the example E-BOM data or attach your own in the same format, and run. The rules can be handed
  to the IFC EBOM Compiler with one click.
result: example-result.md
# example-result.md is also the answer key of scripts/ddc-alignment.scope-rule-drafter.test.ts. After the first
# counted live run, its output may replace it only if that test still passes; then change this label to say so.
result_label: Expected result for the example rules and data, written from the skill's step table and checked by the rule-check helper. Not a model run.
